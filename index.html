<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>坦克驾驶模拟器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>▲ 坦克驾驶模拟器 ▲</h1>
  <div><span class="speed" id="spd">0</span> <span class="unit">km/h</span></div>
  <div class="real">实际车速 <span id="realSpd">0</span> km/h<span id="motionTag"></span></div>
  <div class="row">
    <div class="card"><small>档位</small><b id="gear">N</b></div>
    <div class="card"><small>转速</small><b id="rpm">650</b></div>
    <div class="card"><small>GPS</small><b id="acc">–</b></div>
  </div>

  <button id="start">启动引擎</button>

  <div id="controls" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
    <select id="weaponSel"></select>
    <button id="enterScope">进入瞄准镜</button>
    <div class="seg">
      <button id="mGps" class="on">GPS 车速</button>
      <button id="mMan">手动测试</button>
    </div>
    <div class="seg">
      <button id="eSample">录音引擎</button>
      <button id="eClassic">经典</button>
      <button id="eCyl">逐缸</button>
    </div>
    <div class="seg">
      <button id="tRec">录音履带</button>
      <button id="tV1">合成履带</button>
    </div>
    <div id="manualBox" class="hidden">
      <label>模拟实际车速：<span id="manVal">0</span> km/h</label>
      <input type="range" id="man" min="0" max="120" value="0">
    </div>
    <div id="volBox">
      <label>音量</label>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
    <button id="stop" style="background:#333;color:#ccc;font-size:15px;padding:12px">熄火</button>
  </div>
  <div id="status">点“启动引擎”后允许定位。保持屏幕常亮、本页在前台。</div>

  <div id="scopeView" class="scope-overlay hidden">
    <div class="scope-top">
      <span id="scopeSysName">—</span>
      <button class="scope-exit" id="scopeExit">退出瞄准镜</button>
    </div>
    <div class="scope-stage" id="scopeStage">
      <div class="scope-circle">
        <video id="scopeVideo" autoplay playsinline muted></video>
        <canvas id="scopeCanvas"></canvas>
        <div class="scope-flash" id="scopeFlash"></div>
      </div>
    </div>
    <div class="scope-status" id="scopeStatus"></div>
    <div class="scope-bottom" id="scopeBottom"></div>
  </div>

<script src="app.js"></script>
</body>
</html>
