<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>坦克驾驶模拟器</title>
<link rel="stylesheet" href="styles.css?v=0.2.0">
</head>
<body>
  <div class="role-nav" id="roleNav">
    <button class="role-btn on" data-role="overview">🚗<span>整车</span></button>
    <button class="role-btn" data-role="commander" disabled>🎖️<span>车长</span></button>
    <button class="role-btn" data-role="driver">🕹️<span>驾驶员</span></button>
    <button class="role-btn" data-role="gunner">🎯<span>炮手</span></button>
    <button class="role-btn" data-role="radio" disabled>📻<span>通讯兵</span></button>
    <button class="role-btn" data-role="loader" disabled>📦<span>装填手</span></button>
  </div>

  <h1>▲ 坦克驾驶模拟器 ▲ <small id="ver" style="opacity:.5;font-size:11px;letter-spacing:0;vertical-align:middle"></small></h1>
  <div><span class="speed" id="spd">0</span> <span class="unit">km/h</span></div>
  <div class="real">实际车速 <span id="realSpd">0</span> km/h<span id="motionTag"></span></div>
  <div class="row">
    <div class="card"><small>档位</small><b id="gear">N</b></div>
    <div class="card"><small>转速</small><b id="rpm">650</b></div>
    <div class="card"><small>GPS</small><b id="acc">–</b></div>
  </div>

  <button id="start">启动引擎</button>

  <div id="controls" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
    <div id="pageOverview" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="seg">
        <button id="mGps" class="on">GPS 车速</button>
        <button id="mMan">手动测试</button>
      </div>
      <div id="manualBox" class="hidden">
        <label>模拟实际车速：<span id="manVal">0</span> km/h</label>
        <input type="range" id="man" min="0" max="120" value="0">
      </div>
    </div>

    <div id="pageDriver" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px">
      <div class="cockpit">
        <div class="gear-stick">
          <button class="gear-btn" data-gear="4">4</button>
          <button class="gear-btn" data-gear="3">3</button>
          <button class="gear-btn" data-gear="2">2</button>
          <button class="gear-btn" data-gear="1">1</button>
          <button class="gear-btn on" data-gear="0">N</button>
        </div>
        <div class="lever-group">
          <div class="lever clutch" id="leverClutch">
            <div class="lever-track"><div class="lever-handle"></div></div>
            <label>离合</label>
          </div>
          <div class="lever brake" id="leverBrake">
            <div class="lever-track"><div class="lever-handle"></div></div>
            <label>刹车</label>
          </div>
          <div class="lever throttle" id="leverThrottle">
            <div class="lever-track"><div class="lever-handle"></div></div>
            <label>油门</label>
          </div>
        </div>
      </div>
      <div class="scope-status" id="driverStatus"></div>
    </div>

    <div id="volBox">
      <label>音量</label>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
    <button id="stop" style="background:#333;color:#ccc;font-size:15px;padding:12px">熄火</button>
  </div>
  <div id="status">点“启动引擎”后允许定位。保持屏幕常亮、本页在前台。</div>

  <div class="tank-nav" id="tankNav"></div>
  <div class="tank-nav-hint" id="tankNavHint"></div>

  <div id="scopeView" class="scope-overlay hidden">
    <div class="scope-top">
      <div class="role-nav mini">
        <button class="role-btn" data-role="overview">🚗<span>整车</span></button>
        <button class="role-btn" data-role="commander" disabled>🎖️<span>车长</span></button>
        <button class="role-btn" data-role="driver">🕹️<span>驾驶员</span></button>
        <button class="role-btn on" data-role="gunner">🎯<span>炮手</span></button>
        <button class="role-btn" data-role="radio" disabled>📻<span>通讯兵</span></button>
        <button class="role-btn" data-role="loader" disabled>📦<span>装填手</span></button>
      </div>
      <span id="scopeSysName">—</span>
    </div>
    <div class="scope-zoom" id="scopeZoom"></div>
    <div class="scope-stage" id="scopeStage">
      <div class="scope-circle">
        <video id="scopeVideo" autoplay playsinline muted></video>
        <canvas id="scopeCanvas"></canvas>
        <div class="scope-flash" id="scopeFlash"></div>
      </div>
    </div>
    <div class="scope-status" id="scopeStatus"></div>
    <div class="scope-bottom" id="scopeBottom"></div>
  </div>

<script src="app.js?v=0.2.0"></script>
</body>
</html>
